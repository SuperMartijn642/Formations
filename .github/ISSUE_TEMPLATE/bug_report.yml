name: Bug report
title: "[Bug] Your title here"
description: Report of a bug
labels: bug
body:
  - type: input
    id: input-0
    attributes:
      label: Minecraft version
      description: What Minecraft version are you using?
    validations:
      required: true
  - type: dropdown
    id: dropdown-0
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true
  - type: input
    id: input-1
    attributes:
      label: Formations version
      description: What version of Formations are you using?
    validations:
      required: true
  - type: textarea
    id: textarea-0
    attributes:
      label: Other relevant mods or projects
      description: If your issue is related to other mods or projects, please mention them here. Please also shortly explain what the other projects do if relevant to the issue.
  - type: textarea
    id: textarea-1
    attributes:
      label: Bug description
      description: Please describe your issue. It is often clearest if you describe
        the current behavior and the expected behavior is.
    validations:
      required: true
  - type: textarea
    id: textarea-2
    attributes:
      label: Steps to reproduce
      description: Please describe the steps needed to recreate the issue. If you
        cannot recreate the issue, please describe what you were doing when the
        issue occurred.
    validations:
      required: true
  - type: textarea
    id: textarea-3
    attributes:
      label: Example data pack
      description: If the issue requires a specific data pack setup, please share a link to a data pack with which the issue occurs. Try to include just the files needed to reproduce the issue.
  - type: textarea
    id: textarea-4
    attributes:
      label: Screenshots
      description: Please share some screenshots of the issue. If screenshots are not
        relevant to your issue, you can omit this section.
